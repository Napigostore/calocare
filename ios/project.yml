# XcodeGen spec: `xcodegen generate` in this folder creates CaloCare.xcodeproj.
# The project file itself is not kept in git, so it never needs hand-merging.
name: CaloCare
options:
  bundleIdPrefix: com.calocare
  # English is the fallback for every language other than Vietnamese.
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
targets:
  CaloCare:
    type: application
    platform: iOS
    sources:
      - CaloCare
    # Server address and app key: Config/Backend.xcconfig (not in git; see Backend.xcconfig.example).
    configFiles:
      Debug: Config/Backend.xcconfig
      Release: Config/Backend.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calocare.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Reading Apple Health. The App ID needs the HealthKit capability too (developer.apple.com → Identifiers).
    entitlements:
      path: CaloCare/CaloCare.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: CaloCare/Info.plist
      properties:
        CFBundleDisplayName: CaloCare
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BackendHost: $(BACKEND_HOST)
        BackendAppKey: $(BACKEND_APP_KEY)
        NSCameraUsageDescription: CaloCare dùng camera để chụp bữa ăn và tính calo.
        NSPhotoLibraryUsageDescription: CaloCare đọc ảnh bữa ăn bạn chọn để tính calo.
        NSHealthShareUsageDescription: CaloCare đọc calo vận động, bước chân, phút tập, giấc ngủ, cân nặng và chiều cao từ Apple Health để tính calo tiêu hao và gợi ý ăn uống phù hợp.
        NSHealthUpdateUsageDescription: CaloCare không ghi dữ liệu vào Apple Health.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
