name: iOS

# Builds the iOS app on a GitHub-hosted Mac.
#  - Every push that touches ios/: compiles for the simulator, to catch errors (no Apple account needed).
#  - Run by hand with "testflight" ticked, or push a commit touching ios/ or this file whose message
#    contains [testflight] (an empty commit does not start a run): signs and uploads to TestFlight.
#
# Secrets (repository Settings → Secrets and variables → Actions):
#   BACKEND_HOST      server host without https://, e.g. calocare-api.xxx.workers.dev
#   BACKEND_APP_KEY   appKey from backend.properties
# For TestFlight only:
#   APPLE_TEAM_ID     10-character Team ID of the Apple Developer account
#   ASC_KEY_ID        App Store Connect API key id
#   ASC_ISSUER_ID     App Store Connect API issuer id
#   ASC_KEY_P8        contents of the AuthKey_XXXX.p8 file
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      # The App Store Connect scripts the listing and submit jobs run.
      - "tools/asc_*.py"
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload to TestFlight
        type: boolean
        default: false
      screenshots:
        description: Take App Store screenshots on the 6.9" iPhone simulator
        type: boolean
        default: false
      listing:
        description: Upload the App Store listing (texts and screenshots in ios/fastlane)
        type: boolean
        default: false
      submit:
        description: Submit the prepared version and its subscriptions for App Review
        type: boolean
        default: false

# One run at a time: two runs finishing out of order would publish the older screenshots last.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    # Publishing the .ipa as a release needs write access to the repository's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=Xcode::No Xcode 26 on this runner: $(ls /Applications | grep Xcode | xargs)"; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Backend config
        env:
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          BACKEND_APP_KEY: ${{ secrets.BACKEND_APP_KEY }}
        run: |
          printf 'BACKEND_HOST = %s\nBACKEND_APP_KEY = %s\n' "$BACKEND_HOST" "$BACKEND_APP_KEY" > ios/Config/Backend.xcconfig
          # Fingerprint of the app key (never the key itself), to compare with the server's when the app gets "Unauthorized".
          FINGERPRINT=$(printf '%s' "$BACKEND_APP_KEY" | shasum -a 256 | cut -c1-8)
          echo "::notice title=TestFlight::Backend $BACKEND_HOST, app key fingerprint $FINGERPRINT, length ${#BACKEND_APP_KEY}"
          # The server's app key (appKey in backend.properties) has this fingerprint; any other key makes every AI call "Unauthorized".
          if [ "$FINGERPRINT" != "fbd417e9" ]; then echo "::error title=TestFlight::BACKEND_APP_KEY is not the server's app key (fingerprint $FINGERPRINT, expected fbd417e9). Copy appKey from backend.properties into the secret."; exit 1; fi
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project CaloCare.xcodeproj -scheme CaloCare -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          # Compiler errors, once each, as one annotation on the run so they can be read without opening the log.
          grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -80 > errors.txt || true
          if [ -s errors.txt ]; then
            cat errors.txt
            echo "::error title=Swift errors::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' errors.txt)"
          fi
          grep -q "BUILD SUCCEEDED" build.log
      # An unsigned .ipa for trying the app on one's own iPhone without the App Store: a sideloading
      # tool (Sideloadly, AltStore) signs it with a free Apple ID and installs it over USB.
      - name: Build the unsigned .ipa
        if: github.ref == 'refs/heads/main'
        working-directory: ios
        run: |
          xcodebuild -project CaloCare.xcodeproj -scheme CaloCare -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > device.log 2>&1 || true
          grep -E "error:" device.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -40 > device-errors.txt || true
          if [ -s device-errors.txt ]; then
            echo "::error title=Swift errors::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' device-errors.txt)"
          fi
          grep -q "BUILD SUCCEEDED" device.log
          mkdir Payload
          cp -R device/Build/Products/Release-iphoneos/CaloCare.app Payload/
          # Ad-hoc signature carrying the entitlements (Apple Health), so the sideloading tool keeps them when it re-signs.
          codesign -f -s - --entitlements CaloCare/CaloCare.entitlements Payload/CaloCare.app
          zip -qry CaloCare-unsigned.ipa Payload
          ls -la CaloCare-unsigned.ipa
      - name: Publish the .ipa as the "ios-latest" release
        if: github.ref == 'refs/heads/main'
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest CaloCare-unsigned.ipa --prerelease --target "$GITHUB_SHA" \
            --title "CaloCare iOS – bản thử nghiệm mới nhất" \
            --notes "File .ipa chưa ký, build từ commit $GITHUB_SHA. Cài lên iPhone bằng Sideloadly hoặc AltStore với Apple ID của bạn; bản cài bằng Apple ID miễn phí hết hạn sau 7 ngày."
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log

  testflight:
    # Run by hand with "testflight" ticked, or push a commit whose message contains [testflight].
    if: ${{ inputs.testflight || contains(github.event.head_commit.message, '[testflight]') }}
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=Xcode::No Xcode 26 on this runner: $(ls /Applications | grep Xcode | xargs)"; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Backend config
        env:
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          BACKEND_APP_KEY: ${{ secrets.BACKEND_APP_KEY }}
        run: |
          printf 'BACKEND_HOST = %s\nBACKEND_APP_KEY = %s\n' "$BACKEND_HOST" "$BACKEND_APP_KEY" > ios/Config/Backend.xcconfig
          # Fingerprint of the app key (never the key itself), to compare with the server's when the app gets "Unauthorized".
          FINGERPRINT=$(printf '%s' "$BACKEND_APP_KEY" | shasum -a 256 | cut -c1-8)
          echo "::notice title=TestFlight::Backend $BACKEND_HOST, app key fingerprint $FINGERPRINT, length ${#BACKEND_APP_KEY}"
          # The server's app key (appKey in backend.properties) has this fingerprint; any other key makes every AI call "Unauthorized".
          if [ "$FINGERPRINT" != "fbd417e9" ]; then echo "::error title=TestFlight::BACKEND_APP_KEY is not the server's app key (fingerprint $FINGERPRINT, expected fbd417e9). Copy appKey from backend.properties into the secret."; exit 1; fi
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Archive, sign and upload
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Problems are published as one annotation on the run, so they can be read without opening the log.
          report() {
            grep -iE "error|failed|invalid|denied|no profiles|no account|missing" "$1" | grep -viE "^\s*$|warning:" | sed "s#$GITHUB_WORKSPACE/##" | awk '!seen[$0]++' | head -40 > problems.txt || true
            # Nothing matched: the end of the log usually says what went wrong.
            [ -s problems.txt ] || tail -15 "$1" | sed "s#$GITHUB_WORKSPACE/##" > problems.txt
            echo "::error title=TestFlight::$1: $(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' problems.txt)"
            exit 1
          }
          missing=""
          for name in TEAM KEY_ID ISSUER KEY_P8; do [ -z "${!name}" ] && missing="$missing $name"; done
          if [ -n "$missing" ]; then echo "::error title=TestFlight::Missing secrets:$missing (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          # Each upload needs a build number higher than the last; the run number provides one.
          # The archive is built unsigned: signing it here would need a development profile, which Apple only
          # issues to teams with a registered iPhone. The export below signs it for App Store distribution,
          # which needs no device.
          xcodebuild -project CaloCare.xcodeproj -scheme CaloCare -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CaloCare.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > archive.log 2>&1 || report archive.log
          grep -q "ARCHIVE SUCCEEDED" archive.log || report archive.log
          # An unsigned app carries no entitlements, and the export signs with the ones it finds in the app:
          # an ad-hoc signature with them keeps Apple Health in the uploaded build.
          codesign -f -s - --entitlements CaloCare/CaloCare.entitlements "$RUNNER_TEMP/CaloCare.xcarchive/Products/Applications/CaloCare.app"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CaloCare.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > export.log 2>&1 || report export.log
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log || report export.log
          echo "::notice title=TestFlight::Build ${{ github.run_number }} uploaded. Apple usually needs 10-30 minutes to process it before it appears in TestFlight."
      - name: Keep the signing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log

  screenshots:
    # Run by hand with "screenshots" ticked, or push a commit whose message contains [screenshots].
    if: ${{ inputs.screenshots || contains(github.event.head_commit.message, '[screenshots]') }}
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=Xcode::No Xcode 26 on this runner: $(ls /Applications | grep Xcode | xargs)"; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: |
          cp Config/Backend.xcconfig.example Config/Backend.xcconfig
          xcodegen generate
      - name: Take the screenshots
        working-directory: ios
        run: |
          # The largest iPhone the runner has: a 6.9" model gives the 1320x2868 screenshots App Store Connect asks for.
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $(xcrun simctl list devices available | grep "$DEVICE")"
          xcrun simctl boot "$DEVICE"
          xcrun simctl spawn "$DEVICE" defaults write -g AppleLanguages -array vi
          xcrun simctl spawn "$DEVICE" defaults write -g AppleLocale vi_VN
          xcrun simctl shutdown "$DEVICE" && xcrun simctl boot "$DEVICE"
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcodebuild -project CaloCare.xcodeproj -scheme CaloCare -configuration Debug -sdk iphonesimulator             -destination "id=$DEVICE" -derivedDataPath sim CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || { tail -40 sim.log; exit 1; }
          xcrun simctl install "$DEVICE" sim/Build/Products/Debug-iphonesimulator/CaloCare.app
          mkdir -p shots
          # Vietnamese shots are 01-home.png …, English ones en-01-home.png …; -AppleLanguages picks the app's language per launch.
          for lang in vi en; do
            prefix=$([ "$lang" = en ] && echo "en-" || echo "")
            n=1
            for screen in home food scan menu progress coach profile pro; do
              xcrun simctl terminate "$DEVICE" com.calocare.app 2>/dev/null || true
              xcrun simctl launch "$DEVICE" com.calocare.app -AppleLanguages "($lang)" -AppleLocale "$([ "$lang" = en ] && echo en_US || echo vi_VN)" -demo "$screen" -demoPhoto "$PWD/Screenshots/meal.jpg" \
                || echo "::error title=Swift errors::Launching the $lang $screen screen failed"
              sleep 6
              # A crash on this screen shows up as the app no longer running.
              xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.calocare.app || echo "::error title=Swift errors::The app crashed on the $lang $screen screen"
              xcrun simctl io "$DEVICE" screenshot "shots/${prefix}0$n-$screen.png" || echo "::error title=Swift errors::No screenshot of the $lang $screen screen"
              n=$((n+1))
            done
          done
          # An English walkthrough video on the same simulator, with sample data: the home screen, then one app
          # session touring the screens on its own (-demo tour). For App Review it must be described as a
          # Simulator recording. The whole simulator is switched to English first, home screen included.
          xcrun simctl terminate "$DEVICE" com.calocare.app 2>/dev/null || true
          xcrun simctl spawn "$DEVICE" defaults write -g AppleLanguages -array en
          xcrun simctl spawn "$DEVICE" defaults write -g AppleLocale en_US
          xcrun simctl shutdown "$DEVICE" && xcrun simctl boot "$DEVICE"
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          sleep 15
          xcrun simctl io "$DEVICE" recordVideo --codec h264 --force shots/en-walkthrough-simulator.mp4 &
          RECORDER=$!
          sleep 3
          xcrun simctl launch "$DEVICE" com.calocare.app -demo tour -demoPhoto "$PWD/Screenshots/meal.jpg" > /dev/null
          sleep 52
          kill -INT $RECORDER
          wait $RECORDER || true
          ls -la shots
      - name: Publish as the "ios-screenshots" release
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-screenshots --yes --cleanup-tag || true
          gh release create ios-screenshots shots/*.png shots/*.mp4 --prerelease --target "$GITHUB_SHA"             --title "CaloCare iOS – ảnh chụp màn hình" --notes "Chụp trên máy ảo iPhone 6.9\" từ commit $GITHUB_SHA, dữ liệu mẫu."

  listing:
    # Uploads ios/fastlane/metadata and ios/fastlane/screenshots (made by tools/export_appstore.py) to the
    # version being prepared in App Store Connect. Does not submit for review: that is done in App Store
    # Connect, together with the subscriptions, App Privacy and the age rating.
    # Run by hand with "listing" ticked, or push a commit whose message contains [listing].
    if: ${{ inputs.listing || contains(github.event.head_commit.message, '[listing]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Upload the listing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 tools/asc_listing.py "$(grep -E 'MARKETING_VERSION' ios/project.yml | grep -oE '[0-9][0-9.]*')"
          echo "::notice title=TestFlight::App Store listing and screenshots uploaded for vi and en-US."

  submit:
    # Submits the version being prepared, with the newest processed build, review notes and the CaloCare Pro group and subscriptions,
    # for App Review (tools/asc_submit.py); errors, with the fields Apple says are missing, appear as run annotations. Run by hand with "submit" ticked, or a commit message with [submit].
    if: ${{ inputs.submit || contains(github.event.head_commit.message, '[submit]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Submit for App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 tools/asc_submit.py "$(grep -E 'MARKETING_VERSION' ios/project.yml | grep -oE '[0-9][0-9.]*')"

  unsubmit:
    # [unsubmit]: empties draft review submissions. [check]: lists what each subscription still lacks.
    # [notes]: updates the App Review notes from ios/fastlane/review_notes.txt.
    # [attach]: puts the newest processed build on the version (waiting for processing), then updates the notes.
    if: ${{ contains(github.event.head_commit.message, '[unsubmit]') || contains(github.event.head_commit.message, '[check]') || contains(github.event.head_commit.message, '[notes]') || contains(github.event.head_commit.message, '[attach]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Empty drafts or check subscriptions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 tools/asc_submit.py "$([ "${{ contains(github.event.head_commit.message, '[check]') }}" = true ] && echo --check || { [ "${{ contains(github.event.head_commit.message, '[notes]') }}" = true ] && echo --notes || { [ "${{ contains(github.event.head_commit.message, '[attach]') }}" = true ] && echo --build || echo --reset; }; })"
