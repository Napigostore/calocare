name: iOS

# Builds the iOS app on a GitHub-hosted Mac.
#  - Every push that touches ios/: compiles for the simulator, to catch errors (no Apple account needed).
#  - Run by hand with "testflight" ticked: signs the app and uploads it to TestFlight for iPhone testers.
#
# Secrets (repository Settings → Secrets and variables → Actions):
#   BACKEND_HOST      server host without https://, e.g. calocare-api.xxx.workers.dev
#   BACKEND_APP_KEY   appKey from backend.properties
# For TestFlight only:
#   APPLE_TEAM_ID     10-character Team ID of the Apple Developer account
#   ASC_KEY_ID        App Store Connect API key id
#   ASC_ISSUER_ID     App Store Connect API issuer id
#   ASC_KEY_P8        contents of the AuthKey_XXXX.p8 file
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
    # Run by hand with "testflight" ticked, or push a commit whose message contains [testflight].
    if: ${{ inputs.testflight || contains(github.event.head_commit.message, '[testflight]') }}
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Backend config
        env:
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          BACKEND_APP_KEY: ${{ secrets.BACKEND_APP_KEY }}
        run: printf 'BACKEND_HOST = %s\nBACKEND_APP_KEY = %s\n' "$BACKEND_HOST" "$BACKEND_APP_KEY" > ios/Config/Backend.xcconfig
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Archive, sign and upload
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Problems are published as one annotation on the run, so they can be read without opening the log.
          report() {
            grep -iE "error|failed|invalid|denied|no profiles|no account|missing" "$1" | grep -viE "^\s*$|warning:" | sed "s#$GITHUB_WORKSPACE/##" | awk '!seen[$0]++' | head -40 > problems.txt || true
            [ -s problems.txt ] && echo "::error title=TestFlight::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' problems.txt)"
            exit 1
          }
          missing=""
          for name in TEAM KEY_ID ISSUER KEY_P8; do [ -z "${!name}" ] && missing="$missing $name"; done
          if [ -n "$missing" ]; then echo "::error title=TestFlight::Missing secrets:$missing (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          # Each upload needs a build number higher than the last; the run number provides one.
          xcodebuild -project CaloCare.xcodeproj -scheme CaloCare -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CaloCare.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive > archive.log 2>&1 || report archive.log
          grep -q "ARCHIVE SUCCEEDED" archive.log || report archive.log

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CaloCare.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > export.log 2>&1 || report export.log
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log || report export.log
          echo "::notice title=TestFlight::Build ${{ github.run_number }} uploaded. Apple usually needs 10-30 minutes to process it before it appears in TestFlight."
      - name: Keep the signing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log
